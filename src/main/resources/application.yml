spring:
  application:
    name: ai-engineering-url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
    username: ${DB_USERNAME:url_shortener}
    password: ${DB_PASSWORD:url_shortener}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  url-shortener:
    base-url: ${BASE_URL:http://localhost:8080}
    code-length: ${SHORT_CODE_LENGTH:8}
    max-generation-attempts: ${SHORT_CODE_MAX_ATTEMPTS:5}
    cache-ttl: ${URL_CACHE_TTL:24h}
  analytics:
    core-pool-size: ${ANALYTICS_CORE_POOL_SIZE:2}
    max-pool-size: ${ANALYTICS_MAX_POOL_SIZE:4}
    queue-capacity: ${ANALYTICS_QUEUE_CAPACITY:500}

management:
  endpoints:
    web:
      base-path: /internal/actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /docs/swagger-ui.html
