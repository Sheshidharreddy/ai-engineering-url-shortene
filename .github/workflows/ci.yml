name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/bootstrap
          - infra/environments/dev
          - infra/environments/uat
          - infra/environments/prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize Terraform without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Assert all container integration tests executed
        run: grep -Eq '<testsuite .*tests="20" errors="0" skipped="0" failures="0"' target/surefire-reports/TEST-com.sheshidhar.urlshortener.integration.RedirectIntegrationTest.xml

      - name: Build runtime image
        run: docker build --tag ai-engineering-url-shortener:ci .
