name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Assert container integration tests executed
        run: grep -q 'skipped="0"' target/surefire-reports/TEST-com.sheshidhar.urlshortener.integration.RedirectIntegrationTest.xml

      - name: Build runtime image
        run: docker build --tag ai-engineering-url-shortener:ci .
